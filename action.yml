name: "AgentFixer Autonomous Execution Shield"
description: "Zero-dependency CLI log compressor, context defense, and false-pass sentinel for AI agent evaluation harnesses."
author: "Krish Joshi <krishjoshi507@gmail.com>"

inputs:
  command:
    description: "The test or build command to execute wrapped by AgentFixer"
    required: false
    default: "pytest"
  strict-scope:
    description: "Fail build if out-of-scope files are created or modified"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install AgentFixer
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}

    - name: Run Wrapped Command
      shell: bash
      run: |
        STRICT_FLAG=""
        if [ "${{ inputs.strict-scope }}" = "true" ]; then
          STRICT_FLAG="--strict-scope"
        fi
        agentfix run $STRICT_FLAG -- ${{ inputs.command }}
